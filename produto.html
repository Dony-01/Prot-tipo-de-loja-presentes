<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mozer´s </title>
  <link rel="stylesheet" href="styles.css" >
</head>


<body>

<header class="header">
  <div class="search-bar">

    <div class="menu"> <img src="menu.png" alt="menu"
      height=" 20px" width="20px"
      onclick="openMenu()"> </div>

    <input id="searchInput" type="text" placeholder="Produto desejado...">

    <div class="cart" onclick="window.location='cart.html'">
      <img src="img/cart.png" alt="carrinho"
       height="30px"       width="20px">
      <span id="cart-count">0</span>
    </div>
</header>

<div class="side-menu" id="sideMenu">
  <span onclick="closeMenu()">✖</span>
  <a href="index.html">Início</a>
  <a href="#">Ofertas</a>
  <a href="#">Localidade</a>
  <a href="#">Contato</a>
</div>

<h1 style="margin:20px;">Detalhes do Produto</h1>

<div class="product-page">



  <img id="mainImage" src="" alt="Produto">

  <div class="carousel">
    <img src="img/logo.png" onclick="changeImage(this)">
    <img src="img/canetas2.jpg" onclick="changeImage(this)">
    <img src="img/canetas3.jpg" onclick="changeImage(this)">
  </div>

</div>

<div class="product-info">
  <h2 id="productName"></h2>
  <p id="productPrice"></p>
  <p>Produto de alta qualidade disponível em nossa loja.</p>
  <button id="buyButton">Adicionar no carrinho</button>
</div>

<footer>
  <p>MOZE®´s 2026</p>
  <p>Todos os direitos reservados</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="products.js"></script>
<script src="cart.js"></script>
<script src="menu.js"></script>
</body>
