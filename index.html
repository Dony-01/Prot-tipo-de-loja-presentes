<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mozer´s </title>
  <link rel="stylesheet" href="styles.css" >
</head>

<body>  

<header class="header">

  <div class="search-bar">

    <div class="menu"> <img src="menu.png" alt="menu"
      height=" 20px" width="20px"
      onclick="openMenu()"> </div>

    <input id="searchInput" type="text" placeholder="Produto desejado...">

    <div class="cart" onclick="window.location='cart.html'">
      <img src="cart.png" alt="carrinho"
       height="30px"       width="20px">
      <span id="cart-count">0</span>
    </div>

  </div>

</header>

  <div class="side-menu" id="sideMenu">

  <span class="close-menu" onclick="closeMenu()">✖</span>


  <a href="index.html">Início</a>
  <a href="ofertas.html">Ofertas</a>
  <a href="localização.html">Localidade</a>
  <a href="contato.html">Contato</a>

</div>

<div class="categories">

<button class="category-btn" onclick="filterCategory('all')">Todos</button>

<button class="category-btn" onclick="filterCategory('papelaria')">
Papelaria
</button>

<button class="category-btn" onclick="filterCategory('eletronicos')">
Eletrônicos
</button>

<button class="category-btn" onclick="filterCategory('presentes')">
Presentes
</button>

</div>

<section class="ofertas">
  <h2>OFERTAS 🔥</h2>

  <div class="products" id="ofertas"></div>

</section>

<section class="novidades">
  <h2>NOVIDADES ✨</h2>
  <div class="products-grid" id="newContainer"></div>
</section>

<div class="modal" id="productModal">

  <div class="modal-content">

    <span class="close" onclick="closeModal()">✖</span>

    <img id="modalImage">

    <h2 id="modalName"></h2>

    <h3 id="modalPrice"></h3>

    <button>Adicionar no carrinho</button>

  </div>

<div id="cartItems"></div>

</div>
  
<footer>
  <p>MOZE®´s 2026</p>
  <p>Todos os direitos reservados</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="products.js"></script>
<script src="cart.js"></script>
<script src="menu.js"></script>
</html>
